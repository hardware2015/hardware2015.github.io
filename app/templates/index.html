<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>

<body>
    <main class="screen" data-screen>
        <section class="panel panel-hero" data-hero>
            <div class="hero-box">
                <h1 class="hero-title">
                    <span>Businessmen</span>
                    <span>United</span>
                    <span>Club</span>
                </h1>
                <button class="square-button" type="button" data-enter-button>Enter</button>
            </div>
        </section>

        <section class="panel panel-login hidden" data-login-panel>
            <form class="login-box" data-login-form autocomplete="off">
                <label class="field-box">
                    <span>BUC ID</span>
                    <input type="text" name="buc_id" maxlength="64" required />
                </label>
                <label class="field-box">
                    <span>PASSWORD</span>
                    <input type="password" name="password" maxlength="128" required />
                </label>
                <button class="square-button" type="submit">Enter</button>
                <p class="status-text" data-login-status></p>
            </form>
        </section>

        <section class="panel panel-chat hidden" data-chat-panel>
            <div class="chat-shell">
                <header class="chat-header">
                    <div>
                        <div class="chat-title">Businessmen United Club</div>
                        <div class="chat-subtitle" data-user-meta></div>
                    </div>
                    <button class="square-button square-button-small" type="button" data-logout-button>Exit</button>
                </header>

                <div class="messages" data-messages></div>

                <form class="composer" data-message-form>
                    <label class="field-box field-box-wide">
                        <span>MESSAGE</span>
                        <textarea name="body" maxlength="1000" rows="3" required></textarea>
                    </label>
                    <button class="square-button" type="submit">Send</button>
                </form>
                <p class="status-text" data-chat-status></p>
            </div>
        </section>
    </main>

    <script id="page-state" type="application/json">{{ page_state|tojson }}</script>
    <script src="/static/js/app.js" defer></script>
</body>

</html>
